services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trading_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/trading_bot
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # See scripts/run_live.py for why this isn't left at RiskLimits'
      # conservative 0.05 default -- placeholder qty=1.0 sizing, not a
      # relaxed real-money risk tolerance. Defaults to the safe 0.05 here
      # too if unset, matching the Python-level fallback (defense in depth).
      MAX_DAILY_DRAWDOWN_PCT: ${MAX_DAILY_DRAWDOWN_PCT:-0.05}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dashboard_ro:${DASHBOARD_DB_PASSWORD}@db:5432/trading_bot
    depends_on:
      db:
        condition: service_healthy
    # Bound to loopback only -- never reachable from the local network, let
    # alone the public internet. Read-only role or not, no reason to expose
    # it further than "the machine it's running on."
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  pgdata:
